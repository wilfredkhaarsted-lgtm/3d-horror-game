name: Windows verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    name: Verify (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check Chrome
        shell: pwsh
        run: |
          $chrome = (Get-Command chrome.exe -ErrorAction SilentlyContinue).Source
          if (-not $chrome) {
            $chrome = @(
              (Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'),
              (Join-Path $env:LOCALAPPDATA 'Google\Chrome\Application\chrome.exe')
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $chrome) {
            throw 'Google Chrome was not found on PATH or in its standard installation folders.'
          }
          & $chrome --version

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify -- --no-cache

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-screenshots-windows
          path: .art/shots/
          if-no-files-found: warn
          retention-days: 7
